<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f6f2ea">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;--bg:#f6f2ea;--card:#ffffff;--card2:#f3eee4;--line:#e6dfd1;--ink:#1d2433;--mut:#7a7f8c;--gold:#a8792b;--gold2:#8a611d;--ok:#2e8b57;--bad:#c0392b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:0}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{font-weight:800;letter-spacing:.14em;font-size:11px;color:var(--gold)}
.navd{display:flex;align-items:center;gap:6px}
.navd button{background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:18px}
.navd .today{width:auto;padding:0 12px;font-size:12px;font-weight:600}
.hero{background:linear-gradient(135deg,#ffffff,#fbf8f2);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.hero h1{margin:4px 0 2px;font-size:24px;letter-spacing:-.02em}
.kick{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.sub{color:var(--mut);font-size:13px;line-height:1.45}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{background:#ede6d9;border-radius:999px;padding:5px 10px;font-size:12px;color:#4a5263}
.pill.g{background:rgba(201,161,74,.16);color:var(--gold2)}
.bar{height:8px;background:#ede6d9;border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .3s}
.ex{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(80,60,20,.05);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.exh{display:flex;align-items:center;gap:12px;padding:14px;width:100%;background:none;color:var(--ink);text-align:left}
.code{font-weight:800;color:var(--gold);font-size:13px;min-width:26px}
.exn{font-weight:600;font-size:15px}
.ext{color:var(--mut);font-size:12.5px;margin-top:2px}
.dots{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.dots i{width:9px;height:9px;border-radius:50%;background:#e2dbcd;display:block}
.dots i.on{background:var(--gold)}
.ex.done .exh{opacity:.75}
.ex.done .dots i{background:var(--ok)}
.exb{padding:0 14px 14px;display:none}
.ex.open .exb{display:block}
.pic{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px}
.pic img{width:100%;display:block}
.cues{margin:0 0 10px;padding-left:18px;color:#4a5263;font-size:13px;line-height:1.5}
.hint{background:rgba(201,161,74,.1);border:1px solid rgba(201,161,74,.25);color:var(--gold2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.4}
.hint.n{background:#f3eee4;border-color:var(--line);color:#4a5263}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper label{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.st{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.st button{width:44px;height:52px;background:none;color:var(--gold);font-size:22px;font-weight:600}
.st input{border:0;background:none;text-align:center;font-size:22px;font-weight:700;padding:0;height:52px;min-width:0}
.rir{display:flex;gap:6px;margin:12px 0 4px;align-items:center}
.rir span{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.06em;margin-right:4px}
.rir button{flex:1;height:38px;border-radius:10px;background:var(--card2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.rir button.on{background:var(--gold);color:#ffffff;border-color:var(--gold)}
.big{width:100%;height:56px;border-radius:14px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#ffffff;font-weight:800;font-size:16px;margin-top:12px}
.big:disabled{opacity:.5}
.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);height:44px;border-radius:12px;padding:0 14px;font-weight:600}
.logs{margin-top:12px}
.log{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.log b{color:var(--gold);min-width:52px}
.log .x{margin-left:auto;background:none;color:var(--mut);font-size:18px;padding:4px 8px}
.timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));display:none;z-index:20}
.timer.on{display:block}
.timer .in{max-width:560px;margin:0 auto 8px;padding:0 14px}
.timer .box{background:#fff8e8;border:1px solid var(--gold);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(80,60,20,.18)}
.timer .t{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold2)}
.timer .l{font-size:12px;color:#6b5a35;line-height:1.3}
.timer .box button{margin-left:auto;background:rgba(201,161,74,.18);color:var(--gold2);border-radius:10px;height:38px;padding:0 10px;font-weight:700}
.timer .box button+button{margin-left:6px}
.timer.end .box{background:#eaf6ef;border-color:var(--ok)}
.timer.end .t{color:#2e8b57}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(246,242,234,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;color:var(--mut);height:62px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button.on{color:var(--gold)}
.tabs svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px}
.tg{display:flex;gap:8px}
.tg button{flex:1;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink);font-weight:600}
.tg button.on{background:rgba(63,178,127,.18);border-color:var(--ok);color:#2e8b57}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi .d{font-size:12px;color:var(--mut);margin-top:2px}
.kpi .k{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:18px 0}
.banner{background:#fdf0e4;border:1px solid #e3b98a;color:#7a4a1c;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:10px;display:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ok);color:#ffffff;font-weight:700;padding:10px 16px;border-radius:12px;z-index:200;display:none;font-size:14px}
.tm{text-align:center;padding:8px 0}
.tm .big2{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold2)}
.tm .now{display:flex;justify-content:center;gap:10px;margin:10px 0}
.tm .now div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.tm .now b{display:block;font-size:26px}
.tm .now span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.blocks{display:flex;gap:3px;margin:8px 0}
.blocks i{flex:1;height:8px;border-radius:4px;background:#e2dbcd}
.blocks i.on{background:var(--gold)}.blocks i.done{background:var(--ok)}
.row{display:flex;gap:8px;align-items:center}
svg.ch{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;height:34px;border-radius:9px;background:none;color:var(--mut);font-weight:600;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink)}
.meal{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;width:100%;text-align:left;color:var(--ink)}
.meal .ck{width:28px;height:28px;border-radius:9px;border:2px solid #c9c1b0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#ffffff;margin-top:2px}
.meal.on{border-color:rgba(63,178,127,.5);background:#eef7f1}
.meal.on .ck{background:var(--ok);border-color:var(--ok)}
.meal .hr{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.04em}
.meal .mt{font-weight:600;margin:2px 0 4px}
.meal .md{font-size:13px;color:#4a5263;line-height:1.45}
.meal .mm{font-size:12px;color:var(--mut);margin-top:6px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:40px;height:48px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px}
.water button.on{background:rgba(80,150,230,.2);border-color:#5096e6}
details.card summary{font-weight:700;cursor:pointer;list-style:none}
details.card summary::after{content:"+";float:right;color:var(--gold)}
details.card[open] summary::after{content:"−"}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mac div{background:#f3eee4;border-radius:10px;padding:8px;text-align:center}
.food{background:var(--card);border:1px solid var(--gold);border-radius:var(--r);padding:14px;margin-bottom:12px}
.food textarea{min-height:76px;resize:vertical}
.miss{background:linear-gradient(135deg,#fbf3e2,#fffaf0);border:1px solid rgba(201,161,74,.4);border-radius:var(--r);padding:14px;margin-bottom:12px}
.miss .n{font-size:30px;font-weight:800;color:var(--gold2)}
.miss.ok{background:linear-gradient(135deg,#eaf6ef,#f4fbf7);border-color:rgba(63,178,127,.5)}
.miss.ok .n{color:#2e8b57}
.entry{border-top:1px solid var(--line);padding:10px 0;font-size:13.5px}
.entry .eh{display:flex;align-items:center;gap:8px}
.entry .eh b{color:var(--gold2)}
.entry .eh .x{margin-left:auto;background:none;color:var(--mut);font-size:18px;padding:2px 8px}
.entry .it{color:#4a5263;font-size:12.5px;margin-top:4px;line-height:1.5}
.ask{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.verd{border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px;line-height:1.45}
.verd .vt{font-weight:800;font-size:15px;margin-bottom:4px}
.verd.pode{background:#eaf6ef;border:1px solid var(--ok);color:#2a5a40}.verd.pode .vt{color:#2e8b57}
.verd.ajuste{background:#fbf3e2;border:1px solid var(--gold);color:#5a4a25}.verd.ajuste .vt{color:var(--gold2)}
.verd.nao_pode{background:#fdecec;border:2px solid #d64545;color:#7a1f1f}.verd.nao_pode .vt{color:#c62828}
.logo{text-align:center;padding:26px 0 8px}
.logo .w{font-size:44px;font-weight:800;letter-spacing:.42em;padding-left:.42em;background:linear-gradient(180deg,#c79a45,#8a611d);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .s{font-size:11px;letter-spacing:.3em;color:var(--mut);margin-top:6px;text-transform:uppercase}
.logo .ring{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(168,121,43,.25),rgba(201,161,74,.05) 60%,transparent 70%);display:flex;align-items:center;justify-content:center}
.logo .ring i{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 24px rgba(168,121,43,.35),inset 0 0 12px rgba(168,121,43,.25)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{background:linear-gradient(160deg,#ffffff,#fbf8f2);border:1px solid var(--line);border-radius:20px;padding:18px 16px;text-align:left;color:var(--ink);min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{width:46px;height:46px;border-radius:14px;background:rgba(201,161,74,.14);display:flex;align-items:center;justify-content:center;color:var(--gold2)}
.tile .ic svg{width:26px;height:26px}
.tile .tn{font-weight:700;font-size:16px;margin-top:12px}
.tile .td{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.35}
.tile:active{transform:scale(.98)}
.todaycard{background:linear-gradient(135deg,#fbf3e2,#ffffff);border:1px solid rgba(201,161,74,.35);border-radius:20px;padding:16px}
.todaycard .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.todaycard .row3 div{background:rgba(0,0,0,.035);border-radius:12px;padding:10px;text-align:center}
.todaycard .row3 b{display:block;font-size:18px}.todaycard .row3 span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.qz{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.qz .qn{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.08em}
.qz h2{font-size:21px;margin:6px 0 4px;letter-spacing:-.01em}
.qz .qh{font-size:13px;color:var(--mut);margin-bottom:12px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--ink);font-size:14.5px;font-weight:600;line-height:1.3}
.opt small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.opt.on{border-color:var(--gold);background:rgba(168,121,43,.1)}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .big{margin:0;flex:2}.qnav .ghost{flex:1;height:56px}
.prof{background:linear-gradient(135deg,#fbf3e2,#ffffff);border:1px solid rgba(168,121,43,.35);border-radius:20px;padding:16px;margin-bottom:12px}
.chip{display:inline-block;background:rgba(168,121,43,.12);color:var(--gold2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;margin:3px 4px 0 0}
.pl h4{margin:14px 0 6px;font-size:14px;color:var(--gold2);letter-spacing:.04em;text-transform:uppercase}
.pl .dayb{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px}
.pl .dayb b{display:block}
.sp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.sp .sh{display:flex;align-items:center;gap:12px}
.sp .se{width:46px;height:46px;border-radius:14px;background:rgba(168,121,43,.12);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.dw{display:flex;gap:5px;margin-top:8px}
.dw button{flex:1;height:40px;border-radius:10px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink)}
.dw button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.dw span{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:5px 0;border-radius:8px;background:var(--card2);color:var(--mut)}
.dw span.on{background:rgba(168,121,43,.16);color:var(--gold2)}
.tiles .tile.wide{grid-column:span 2;min-height:96px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.tiles .tile.wide .tn{margin-top:0}
.bill{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 14px}
.bill button{flex:1;height:44px;border-radius:11px;background:none;color:var(--mut);font-weight:700;font-size:14px}
.bill button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(80,60,20,.12)}
.bill .off{font-size:11px;background:var(--ok);color:#fff;border-radius:99px;padding:2px 7px;margin-left:6px}
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;position:relative}
.plan.hl{border:2px solid var(--gold);box-shadow:0 10px 30px rgba(168,121,43,.15)}
.plan .badge{position:absolute;top:-12px;left:18px;background:var(--gold);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.06em;border-radius:99px;padding:5px 12px}
.plan .pn{font-size:20px;font-weight:800}
.plan .pd{font-size:13px;color:var(--mut);margin-top:2px}
.plan .pp{font-size:34px;font-weight:800;margin-top:12px;letter-spacing:-.02em}
.plan .pp small{font-size:15px;font-weight:600;color:var(--mut)}
.plan .pe{font-size:12.5px;color:var(--ok);font-weight:700;margin-top:2px;min-height:17px}
.plan ul,.feat{list-style:none;margin:12px 0 4px;padding:0}
.feat li,.plan li{font-size:14px;padding:5px 0 5px 26px;position:relative;line-height:1.35}
.feat li:before,.plan li:before{content:"✓";position:absolute;left:2px;color:var(--gold);font-weight:800}
.plan li.no{color:var(--mut)}.plan li.no:before{content:"–";color:var(--mut)}
.mac b{display:block;font-size:16px}.mac span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.navd .today{display:flex;align-items:center;gap:6px}
#cal{display:none;position:fixed;inset:0;z-index:60;background:rgba(29,36,51,.25)}
.calbox{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:min(340px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 18px 40px rgba(80,60,20,.22)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calh b{font-size:16px}
.calh button{width:38px;height:38px;border-radius:10px;background:var(--card2);color:var(--gold2);font-size:20px}
.calw,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calw span{font-size:11px;font-weight:700;color:var(--mut);padding:4px 0}
.calg button{position:relative;height:40px;border-radius:10px;background:none;color:var(--ink);font-weight:600;font-size:14px}
.calg button.pl{background:rgba(201,161,74,.12)}
.calg button.tod{box-shadow:inset 0 0 0 2px var(--gold)}
.calg button.sel{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
.calg button i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.calf{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--mut);margin-top:10px}
.calf .lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.lg.pl{background:rgba(201,161,74,.3)}.lg.dt{background:var(--ok);border-radius:50%}
#gate{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto}
.gin{max-width:420px;margin:0 auto;padding:46px 20px 40px}
.glogo{text-align:center;margin-bottom:24px}.gring{width:46px;height:46px;margin:0 auto 18px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 24px rgba(201,161,74,.55)}

.gcard{background:linear-gradient(135deg,#ffffff,#fbf8f2);border:1px solid var(--line);border-radius:20px;padding:20px}
.gcard h2{margin:0 0 6px;font-size:22px}.gcard p{margin:0 0 14px;color:var(--mut);line-height:1.45}

.gtabs button{flex:1;height:40px;border-radius:9px;background:none;color:var(--mut);font-weight:700}
.gtabs button.on{background:var(--card);color:var(--gold2);box-shadow:0 1px 3px rgba(80,60,20,.12)}
.glink{display:block;width:100%;background:none;color:var(--gold2);font-weight:700;margin-top:12px;height:36px}
.gsmall{font-size:12px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.4}.gsmall a{color:var(--gold2);font-weight:700}
.gmsg{background:rgba(201,161,74,.1);border:1px solid rgba(201,161,74,.25);color:var(--gold2);border-radius:12px;padding:10px 12px;font-size:13px;margin:4px 0 4px;line-height:1.4}
.ggrp{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin:14px 0 8px}
.gopt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.gopt.hl{border:2px solid var(--gold);background:var(--card)}.gopt b{display:block;font-size:15px}.gopt span{font-size:12px;color:var(--mut)}.gopt em{font-style:normal;font-weight:800;color:var(--gold2);font-size:16px;white-space:nowrap}
.gspin{width:36px;height:36px;margin:10px auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:gsp 1s linear infinite}@keyframes gsp{to{transform:rotate(360deg)}}
#instHelp{display:none;position:fixed;inset:0;z-index:150;background:rgba(29,36,51,.45);align-items:flex-end;justify-content:center}
.ihb{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.ihb h2{margin:0 0 4px;font-size:21px}.ihb .sub{margin-bottom:12px}
.ihtabs{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:12px}.ihtabs button{flex:1;height:38px;border-radius:9px;background:none;color:var(--mut);font-weight:700}.ihtabs button.on{background:var(--card);color:var(--gold2);box-shadow:0 1px 3px rgba(80,60,20,.12)}
.ihs{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ihs .n{flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.ihs>div>b{display:block;margin-bottom:2px}.ihs>div>span{font-size:13.5px;color:var(--mut);line-height:1.4}

    const m=p.match(/(\d+[\.,]?\d*)\s*(kg|g|gr|gramas?|ml|l\b)?/); let g;
    if(m){ const n=parseFloat(m[1].replace(",",".")); const u=m[2]||"";
      g = /kg|^l$/.test(u)?n*1000 : u? n : (/colher/.test(p)? n*15 : /fatia/.test(p)? n*30 : /lata/.test(p)? n*120 : /(scoop|dose)/.test(p)? n*30 : /x[ií]cara/.test(p)? n*200 : /concha/.test(p)? n*100 : /fil[eé]/.test(p)? n*150 : n*f[3]); }
    else g = /colher/.test(p)?15: f[3];
    itens.push({alimento:p,quantidade:Math.round(g)+" g",proteina:Math.round(f[1]*g/100),kcal:Math.round(f[2]*g/100)}); }
  return {itens,proteina:itens.reduce((a,i)=>a+i.proteina,0),kcal:itens.reduce((a,i)=>a+i.kcal,0),fonte:"local"};
}

let actx=null;
function audioInit(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume()}catch(e){}}
function beep(n=3){try{if(!actx)return;for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22)}}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
let rest={end:0,label:"",iv:null};
function startRest(sec,label){ if(!sec)return; rest.end=Date.now()+sec*1000; rest.label=label; $("#timer").classList.add("on"); $("#timer").classList.remove("end"); tickRest(); clearInterval(rest.iv); rest.iv=setInterval(tickRest,250) }
function tickRest(){ const left=Math.ceil((rest.end-Date.now())/1000); const t=$("#tT"), l=$("#tL");
  if(left>0){ t.textContent=`${pad(Math.floor(left/60))}:${pad(left%60)}`; l.innerHTML=`Descanso<br>${esc(rest.label)}` }
  else { if(!$("#timer").classList.contains("end")){ $("#timer").classList.add("end"); beep(); t.textContent="00:00"; l.innerHTML="Bora!<br>Próxima série"; setTimeout(()=>{ if(Date.now()-rest.end>5500) stopRest() },6000) } }
}

/* treadmill interval timer */
let tread={on:false,start:0,blocks:[],iv:null,key:null,lastBlock:-1,paused:0,pauseAt:0};
function treadStart(key,blocks){ audioInit(); keepAwake(); tread={on:true,start:Date.now(),blocks,iv:null,key,lastBlock:0,paused:0,pauseAt:0}; clearInterval(tread.iv); tread.iv=setInterval(treadTick,500); render() }
function treadElapsed(){ return ((tread.pauseAt||Date.now())-tread.start-tread.paused)/1000 }
function treadTick(){ if(!tread.on)return; const el=treadElapsed(); let acc=0,bi=0; for(;bi<tread.blocks.length;bi++){ acc+=tread.blocks[bi][0]*60; if(el<acc)break }
  if(bi!==tread.lastBlock){ tread.lastBlock=bi; beep(2) }
  const box=document.getElementById("tm-"+tread.key); if(box) box.innerHTML=treadHtml(); if(bi>=tread.blocks.length){ clearInterval(tread.iv); } }
function treadHtml(){ const tot=tread.blocks.reduce((a,b)=>a+b[0],0)*60; const el=Math.min(treadElapsed(),tot); let acc=0,bi=0; for(;bi<tread.blocks.length;bi++){ if(el<acc+tread.blocks[bi][0]*60)break; acc+=tread.blocks[bi][0]*60 }
  if(bi>=tread.blocks.length) return `<div class="tm"><div class="big2">✓</div><div class="sub">Esteira concluída. Toque em Registrar.</div></div>`;
  const b=tread.blocks[bi], leftBlock=Math.ceil(acc+b[0]*60-el), left=Math.ceil(tot-el);
  const nx=tread.blocks[bi+1];
  return `<div class="tm"><div class="sub">Bloco ${bi+1} de ${tread.blocks.length} · muda em ${pad(Math.floor(leftBlock/60))}:${pad(leftBlock%60)}</div>
  <div class="now"><div><b>${b[1]}%</b><span>Inclinação</span></div><div><b>${String(b[2]).replace(".",",")}</b><span>km/h</span></div></div>
  <div class="big2">${pad(Math.floor(left/60))}:${pad(left%60)}</div>
  <div class="blocks">${tread.blocks.map((x,i)=>`<i class="${i<bi?"done":i===bi?"on":""}"></i>`).join("")}</div>
  <div class="sub">${nx?`Próximo: ${nx[1]}% a ${String(nx[2]).replace(".",",")} km/h`:"Último bloco"}</div></div>`}

function lastSessionOf(key,beforeDate){
  const prev=SETS.filter(s=>s.ex===key&&s.date<beforeDate); if(!prev.length)return null;
  const d=prev.map(s=>s.date).sort().pop(); return {date:d,sets:prev.filter(s=>s.date===d).sort((a,b)=>a.set-b.set)};
}
function suggestion(key,rmin,rmax,last){
  const m=EX[key].m;
  if(!last) return {txt:"Primeira vez: escolha uma carga em que você termine a série com o RIR alvo de hoje.",w:null};
  const sum=last.sets.map(s=>m==="time"?`${s.reps}s`:m==="bw"?`${s.reps}`:m==="dist"?`${fmtKg(s.w)}kg×${s.reps}m`:`${fmtKg(s.w)}×${s.reps}`).join(" · ");
  const maxW=Math.max(...last.sets.map(s=>s.w||0));
  const allTop=last.sets.length>0&&last.sets.every(s=>s.reps>=rmax);
  let tip;
  if(m==="load"||m==="dist") tip = allTop ? `Bateu o topo em todas: suba 1 a 2 kg hoje.` : `Mantenha ${fmtKg(maxW)} kg e busque +1 repetição.`;
  else if(m==="time") tip = `Tente +5 s por série.`; else tip=`Tente +1 a 2 repetições.`;
  return {txt:`Última vez (${br(last.date)}): ${sum}<br><b>${tip}</b>`,w:(m==="load"||m==="dist")?(allTop?maxW+(maxW<10?1:2):maxW):null};
}

function exBody(code,key,n,rmin,rmax,rs,info,mine){
  const E=EX[key];
  const pic=E.img?`<div class="pic"><img src="img/${E.img}.jpg" alt="${esc(E.n)}" loading="lazy"></div>`:"";
  const cues=`<ul class="cues">${E.c.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`;
  const logs=mine.length?`<div class="logs">${mine.map((s,i)=>`<div class="log"><b>Série ${i+1}</b><span>${E.m==="load"?`${fmtKg(s.w)} kg × ${s.reps}`:E.m==="time"?`${s.reps} s`:E.m==="dist"?`${fmtKg(s.w)} kg × ${s.reps} m`:E.m==="tread"||E.m==="simple"?`${s.reps} min`:`${s.reps} reps`}${s.rir!=null&&s.rir!==""&&E.m!=="tread"&&E.m!=="simple"?` · RIR ${s.rir}`:""}</span><button class="x" onclick="delSet('${s.id}')" aria-label="Apagar">×</button></div>`).join("")}</div>`:"";
  if(E.m==="tread"){
    const bl=treadBlocks(info.s,info); const running=tread.on&&tread.key===code;
    const tbl=`<table><tr><th>Min</th><th>Inclinação</th><th>km/h</th></tr>${(()=>{let a=0;return bl.map(b=>{const r=`<tr><td>${a} a ${a+b[0]}</td><td>${b[1]}%</td><td>${String(b[2]).replace(".",",")}</td></tr>`;a+=b[0];return r}).join("")})()}</table>`;
    return pic+cues+(running?`<div id="tm-${code}">${treadHtml()}</div><div class="row"><button class="ghost" style="flex:1" onclick="treadPause()">${tread.pauseAt?"Retomar":"Pausar"}</button><button class="ghost" style="flex:1" onclick="treadStop()">Parar</button></div>`:tbl+`<button class="big" onclick="treadStart('${code}',${JSON.stringify(bl).replace(/"/g,"&quot;")})">▶ Iniciar timer da esteira</button>`)
      +(mine.length?logs:`<button class="ghost" style="width:100%;margin-top:10px" onclick="logCardio('${code}','${key}',${bl.reduce((a,b)=>a+b[0],0)})">Registrar como feita</button>`);
  }
  if(E.m==="simple") return cues+(mine.length?logs:`<button class="big" onclick="logCardio('${code}','${key}',${rmin})">Marcar como feito</button>`);
  const last=lastSessionOf(key,sel); const sg=suggestion(key,rmin,rmax,last);
  const dr=draft[code]||(draft[code]={w: mine.length?mine[mine.length-1].w:(sg.w??(E.m==="load"?10:E.m==="dist"?16:0)), r: mine.length?mine[mine.length-1].reps:(E.m==="time"?rmin:(key==="flexao"?10:rmax)), rir: info.phase===0||info.light?3:info.phase===1?2:info.phase===2?2:1});
  const next=mine.length+1; const over=mine.length>=n;
  const wField = (E.m==="load"||E.m==="dist")?`<div class="stepper"><label>Carga (kg${E.m==="dist"?" cada mão":""})</label><div class="st"><button onclick="adjD('${code}','w',-1)">−</button><input inputmode="decimal" value="${fmtKg(dr.w)}" onchange="setD('${code}','w',this.value)"><button onclick="adjD('${code}','w',1)">+</button></div></div>`:"";
  const rLabel = E.m==="time"?"Segundos":E.m==="dist"?"Metros":"Repetições";
  const rStep = E.m==="time"?5:E.m==="dist"?5:1;
  const rField = `<div class="stepper"><label>${rLabel}</label><div class="st"><button onclick="adjD('${code}','r',-${rStep})">−</button><input inputmode="numeric" value="${dr.r}" onchange="setD('${code}','r',this.value)"><button onclick="adjD('${code}','r',${rStep})">+</button></div></div>`;
  const rir = E.m==="time"||E.m==="dist"?"":`<div class="rir"><span>RIR</span>${[0,1,2,3,4].map(x=>`<button class="${dr.rir===x?"on":""}" onclick="setD('${code}','rir',${x})">${x}${x===4?"+":""}</button>`).join("")}</div>`;
  return pic+cues+`<div class="hint ${last?"":"n"}">${sg.txt}</div>`+
    `<div class="${wField?"grid2":""}">${wField}${rField}</div>${rir}`+
    `<button class="big" onclick="logSet('${code}','${key}',${rs},${n})">${over?`Registrar série extra (${next})`:`Registrar série ${next} de ${n}`}</button>`+logs;
}

function goalsCard(ds){
  const sa=sportAdj(sel); const P=ds.P;
  const G=[["Calorias",ds.kcal,P.kcal+sa.add,"kcal","limit"],["Proteína",ds.prot,165,"g","min"],["Carboidrato",ds.carb,P.carb+Math.round(sa.add/4),"g","limit"],["Gordura",ds.fat,P.fat,"g","limit"],["Água",(ds.d.agua||0)/2,P.agua/2,"L","min"]];
  const f=(v,u)=>u==="L"?String(Math.round(v*10)/10).replace(".",","):Math.round(v).toLocaleString("pt-BR");
  const rows=G.map(([n,v,t,u,kind])=>{ const pct=Math.min(100,t?v/t*100:0); const diff=v-t; let txt,col,bar;
    if(diff<0){ txt=`Faltam ${f(-diff,u)} ${u}`; col="var(--mut)"; bar="linear-gradient(90deg,var(--gold),var(--gold2))" }
    else if(kind==="min"){ txt=diff<(u==="L"?.05:1)?"Meta batida ✓":`Meta batida ✓ +${f(diff,u)} ${u}`; col="var(--ok)"; bar="var(--ok)" }
    else if(diff<=t*.03){ txt="Na meta ✓"; col="var(--ok)"; bar="var(--ok)" }
    else { txt=`Passou ${f(diff,u)} ${u}`; col="var(--bad)"; bar="var(--bad)" }
    return `<div style="padding:9px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-weight:700">${n}</span><span style="font-size:13px;color:var(--mut)">${f(v,u)} de ${f(t,u)} ${u}</span></div>
      <div class="bar" style="margin-top:6px;height:7px"><i style="width:${pct}%;background:${bar}"></i></div><div style="font-size:12.5px;font-weight:700;color:${col};margin-top:4px">${txt}</div></div>` }).join("");
  return `<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Metas de hoje</h3><button class="ghost" style="height:32px;padding:0 10px;font-size:12px" onclick="go('dieta')">Registrar comida</button></div>

}

function bodyKg(){ const ds=Object.values(DAYS).filter(d=>d.peso).sort((a,b)=>a.date<b.date?-1:1); if(ds.length) return ds[ds.length-1].peso;
  const p=PROFILE&&PROFILE.answers&&PROFILE.answers.corpo; return num(p&&p.peso)||82 }
function sessKcal(it,min){ const met=(SPORTLIST[it.sport]||{i:[["",5]]}).i[it.int||0][1]; const kg=bodyKg(); const h=(min??it.min)/60;
  return {gross:Math.round(met*kg*h),net:Math.round((met-1)*kg*h),met} }
function sportsOnDay(date){ const dow=fromIso(date).getDay();
  const logged=SETS.filter(x=>x.date===date&&(x.mode==="sport"||x.mode==="tennis"));
  if(logged.length) return logged.map(x=>{const id=x.mode==="tennis"?"tenis":x.ex; const it=(SPORTS.items||[]).find(i=>i.sport===id)||{sport:id,int:0}; const k=x.kcal?{gross:x.kcal,net:x.kcalNet||Math.round(x.kcal*.85)}:sessKcal(it,x.reps); return {it,min:x.reps,...k,logged:true,logId:x.id}});
  return (SPORTS.items||[]).filter(i=>(i.days||[]).includes(dow)).map(i=>({it:i,min:i.min,...sessKcal(i),logged:false})) }
function sportWeek(){ let min=0,gross=0,net=0; (SPORTS.items||[]).forEach(i=>{const n=(i.days||[]).length; const k=sessKcal(i); min+=n*i.min; gross+=n*k.gross; net+=n*k.net}); return {h:min/60,gross,net,perDay:Math.round(net*EATBACK/7)} }
function sportAdj(date){ const ss=sportsOnDay(date); const net=ss.reduce((a,x)=>a+x.net,0); let add=Math.round(net*EATBACK/10)*10;
  const info=dayInfo(date); const builtIn = info.s==="TENNIS" ? 220 : 0; add=Math.max(0,add-builtIn); return {ss,net,gross:ss.reduce((a,x)=>a+x.gross,0),add} }

function qValid(q){ const v=qAns[q.k]; if(q.opt) return true;

window.qNum=(k,val)=>{ qAns.corpo=qAns.corpo||{}; qAns.corpo[k]=val };
window.qPick=l=>{ const q=Q[qStep];
  if(q.type==="multi"){ let a=qAns[q.k]||[]; const excl=["Nenhum","Nenhuma","Corpo todo por igual"];
    if(a.includes(l)) a=a.filter(x=>x!==l); else { if(excl.includes(l)) a=[l]; else { a=a.filter(x=>!excl.includes(x)); if(q.max&&a.length>=q.max) a=a.slice(1); a.push(l) } }
    qAns[q.k]=a; render(true) }
  else { qAns[q.k]=l; render(true); setTimeout(()=>qNext(),180) } };

function baseMacros(a){ const c=a.corpo||{}; const kg=num(c.peso)||80, cm=num(c.altura)||175, age=num(c.idade)||35; const male=a.sexo!=="Feminino";
  const bmr=10*kg+6.25*cm-5*age+(male?5:-161); const act={"2":1.4,"3":1.45,"4":1.55,"5":1.6,"6":1.7,"7":1.75}[a.dias]||1.5; const tdee=bmr*act*(a.rotina&&a.rotina.startsWith("Fisicamente")?1.1:1);
  const adj={"Perder gordura":-500,"Hipertrofia":250,"Recomposição":-350,"Performance esportiva":0,"Saúde e bem-estar":-150}[a.objetivo]||0;
  const sw=sportWeek(); const kcal=Math.round((tdee+adj+sw.perDay)/50)*50; const prot=Math.round(kg*(a.objetivo==="Saúde e bem-estar"?1.6:2.0)); const fat=Math.round(kg*0.9); const carb=Math.max(80,Math.round((kcal-prot*4-fat*9)/4));
  return {kcal,prot,fat,carb,agua:Math.round(kg*0.035*10)/10,tdee:Math.round(tdee)} }

    treino:{divisao:+a.dias>=5?"Superior / Inferior + condicionamento":+a.dias>=3?"Corpo inteiro A / B":"Corpo inteiro",prioridades:`Prioridade para ${(a.foco||[]).join(", ").toLowerCase()||"o corpo todo"}: começam cada treino e recebem 2 estímulos por semana.`,dias:[]},

  const P=JSON.parse(JSON.stringify(PROFILE)); P.plan=plan; P.planAt=new Date().toISOString(); planBusy=false; saveProfile(P); toast("Plano pronto ✓");

function dietOf(date){ return DIET[date]||{meals:{},agua:0,extra:0} }
function dietStats(date){ const info=dayInfo(date); const P=MEALS[dayType(info)]; const d=dietOf(date); const subs=d.subs||{}; const lg=d.log||[];
  let prot=0,kcal=0,carb=0,fat=0; const left=[]; let done=0;
  const cf=e=>{ if(e.carbo!=null&&e.gordura!=null) return [+e.carbo||0,+e.gordura||0]; const rem=Math.max(0,(e.kcal||0)-(e.proteina||0)*4); return [Math.round(rem*.5/4),Math.round(rem*.5/9)] };
  for(const m of P.m){ const sb=subs[m[0]]; if(sb){const [c,f]=cf(sb);prot+=sb.proteina||0;kcal+=sb.kcal||0;carb+=c;fat+=f;done++} else if(d.meals&&d.meals[m[0]]){prot+=m[4];kcal+=m[5];carb+=m[6]||0;fat+=m[7]||0;done++} else left.push(m) }
  prot+=(d.extra||0)*24+lg.reduce((a,e)=>a+(e.proteina||0),0); kcal+=(d.extra||0)*115+lg.reduce((a,e)=>a+(e.kcal||0),0);
  carb+=(d.extra||0)*2+lg.reduce((a,e)=>a+cf(e)[0],0); fat+=(d.extra||0)*1.5+lg.reduce((a,e)=>a+cf(e)[1],0); carb=Math.round(carb); fat=Math.round(fat);
  return {P,d,done,total:P.m.length,prot,kcal,carb,fat,left,leftProt:left.reduce((a,m)=>a+m[4],0),entries:lg.length,pct:Math.round(done/P.m.length*100)} }

function fileB64(blob){ return new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]); fr.onerror=no; fr.readAsDataURL(blob) }) }
async function shrinkImage(file){
  const url=URL.createObjectURL(file); try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url });
    const s=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",.88)); return await fileB64(b);
  } finally{ URL.revokeObjectURL(url) } }
window.upPick=async input=>{

    else if(f.type.startsWith("image/")||/\.(jpe?g|png|webp|heic|heif)$/.test(nm)){ try{ body.mime="image/jpeg"; body.data=await shrinkImage(f) }catch(e){ throw new Error("Não consegui abrir essa imagem. Tire um print da tela e envie o print.") } }

    UP={busy:false,res:data.result||{},name:f.name,err:""};

window.gBuy=async k=>{ if(gateBusy) return; gateBusy=true; gateMsg="Abrindo o pagamento…"; renderPay();
  try{ const {data,error}=await sb.functions.invoke("checkout",{body:{plan:k}}); gateBusy=false;
    if(error||!data?.url){ let d=null; try{ d=await error?.context?.json() }catch(e){} gateMsg=d?.error==="pagamento_nao_configurado"?"Pagamento em configuração. Em breve!":"Não consegui abrir o pagamento. Tente de novo."; return renderPay() }
    location.href=data.url }catch(e){ gateBusy=false; gateMsg="Sem conexão. Tente de novo."; renderPay() } };
window.gRecheck=()=>{ gateMsg=""; waitPayment("check") };
async function waitPayment(kind){
  gateShow(`<div class="gcard"><h2>Confirmando pagamento</h2><p>${kind==="pendente"?"Seu pagamento está em processamento. Se for Pix, conclua no app do banco.":"Estamos confirmando com o Mercado Pago. Leva poucos segundos."}</p><div class="gspin"></div></div>`);
  for(let i=0;i<(kind==="check"?4:40);i++){ try{ SUB=await fetchSub() }catch(e){}
    if(subActive(SUB)){ try{ localStorage.setItem("aura_sub",JSON.stringify(SUB)) }catch(e){} history.replaceState(null,"",location.pathname); toast("Plano ativado ✓"); return enterApp(true) }
    await new Promise(r=>setTimeout(r,3000)) }
  history.replaceState(null,"",location.pathname);
  gateMsg=kind==="check"?"Ainda não encontramos seu pagamento. Se pagou agora, aguarde 1 minuto e toque em verificar de novo.":"Ainda não recebemos a confirmação. Se pagou por Pix, ela chega em instantes: toque em \"Já paguei, verificar\".";
  renderPay();
}

/* ---------- entrar no app + sincronizar dados ---------- */
async function enterApp(online){
  gateHide(); mode="local"; lsLoad(); render();
  if(!online||!sb||!USER) return;
  await pullMerge(true);
}
function mergeData(c,l){ // c = nuvem, l = este aparelho. Junta os dois sem perder registros.
  const ids=new Set((c.sets||[]).map(x=>x.id)); const sets=[...(c.sets||[])]; (l.sets||[]).forEach(x=>{ if(!ids.has(x.id)) sets.push(x) });
  const obj=(a,b)=>{ const o={...(b||{})}; Object.keys(a||{}).forEach(k=>{ const x=a[k], y=o[k]; o[k]=(y&&x&&(y.savedAt||y.updatedAt||"")>(x.savedAt||x.updatedAt||""))?y:x }); return o };
  const pa=c.profile, pb=l.profile; const profile=(pa&&pb)?(((pb.updatedAt||"")>(pa.updatedAt||""))?pb:pa):(pa||pb||null);
  const sports=((c.sports&&c.sports.items||[]).length)?c.sports:(l.sports||{items:[]});
  return {sets,days:obj(c.days,l.days),diet:obj(c.diet,l.diet),profile,sports};
}
let lastPull=0;
async function pullMerge(first){
  if(!sb||!USER) return; lastPull=Date.now();
  try{ const {data}=await sb.from("user_data").select("data").eq("user_id",USER.id).maybeSingle();
    const local={sets:SETS,days:DAYS,diet:DIET,profile:PROFILE,sports:SPORTS};
    const j=data&&data.data?mergeData(data.data,local):local;
    SETS=j.sets;DAYS=j.days;DIET=j.diet;PROFILE=j.profile;SPORTS=j.sports||{items:[]}; try{ localStorage.setItem(LS,JSON.stringify(j)) }catch(e){}
    cloudReady=true; render(true);
    if(!data||JSON.stringify(data.data)!==JSON.stringify(j)) cloudPush(true);
  }catch(e){ if(first) cloudReady=false }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&USER&&Date.now()-lastPull>20000) pullMerge(false) });
function cloudPush(now){ if(!sb||!USER||!cloudReady) return; clearTimeout(pushT);
  pushT=setTimeout(async()=>{ try{ await sb.from("user_data").upsert({user_id:USER.id,data:{sets:SETS,days:DAYS,diet:DIET,profile:PROFILE,sports:SPORTS},updated_at:new Date().toISOString()}) }catch(e){} }, now?0:1500) }
function accountCard(){
  if(!USER) return "";
  const a=subActive(SUB);
  return `<div class="card"><div class="kick">Sua conta</div><div style="font-weight:700;margin-top:6px">${esc(USER.email)}</div>
    <div class="sub" style="margin-top:4px">${a?`${PLAN_NAME[SUB.plan]||"Aura"} · válido até ${fmtD(SUB.expires_at)}`:"Sem plano ativo"}</div>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="gLogout()">Sair da conta</button></div>`;
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") cloudPush(true) });

render(); boot();
</script>
